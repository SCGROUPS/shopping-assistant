name: Validate and deploy

on:
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "frontend/src/data/**"
      - "frontend/public/assets/catalog/**"
      - "**/*.csv"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "frontend/src/data/**"
      - "frontend/public/assets/catalog/**"
      - "**/*.csv"

permissions:
  contents: read

# Two groups, not one. A single `production-deployment` group serialised pull
# request validation behind production deploys, so opening a PR while main was
# deploying meant waiting out a full deploy before the first test even started -
# for a run that touches none of the same resources.
#
# Deploys still serialise against each other, and are never cancelled: half a
# deploy is worse than a late one. PR runs are per-branch and *are* cancelled,
# because a superseded commit's results are not worth the runner.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'production-deployment'
        || format('validate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    runs-on: ubuntu-latest

    # The database code paths have a separate implementation from demo mode and
    # were previously never executed by CI, so SQL-only defects could only be
    # found by deploying. A throwaway PostgreSQL server makes them testable.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vietra
          POSTGRES_PASSWORD: vietra
          POSTGRES_DB: vietra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vietra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Validate backend
        working-directory: backend
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://vietra:vietra@127.0.0.1:5432/vietra_test
        run: |
          uv sync --dev --locked
          # Lint first. It takes seconds and used to run after the test suite,
          # so a misplaced import was reported minutes late, behind a run that
          # had already done all its work.
          uv run ruff check .
          uv run pytest -q
          uv run pyright

      # Types and unit tests cannot tell you the answers got worse. This can:
      # it fails on any golden case that used to pass, so a ranking change has
      # to be argued for rather than merged on the strength of looking sensible.
      - name: Evaluate answer quality
        working-directory: backend
        run: uv run python -m app.evals.cli --suite search

  # Split from the backend rather than appended to it. The two share no state,
  # so running them in sequence spent the frontend's whole duration waiting for
  # a test suite it does not depend on.
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm lint

      - name: Validate Bicep
        run: az bicep build --file infra/bicep/main.bicep --stdout >/dev/null

  deploy:
    if: github.event_name == 'push'
    needs: [validate, validate-frontend]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Vietra
        id: deploy
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          ADMIN_BOOTSTRAP_KEY: ${{ secrets.ADMIN_BOOTSTRAP_KEY }}
          VIETRA_PREFIX: ${{ vars.VIETRA_PREFIX }}
          AZURE_LOCATION: eastus2
          AZURE_POSTGRES_LOCATION: centralus
        run: ./scripts/deploy.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Chromium is ~150MB and is redownloaded on every run without this. Keyed
      # on the lockfile so a Playwright upgrade misses the cache rather than
      # testing against the browser the previous version pinned.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # The cache holds the browser, not the OS libraries it links against, so
      # a hit still has to install those - just not the 150MB download.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      - name: Run live browser journeys
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.app_url }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_BOOTSTRAP_KEY }}
        run: pnpm test:e2e
