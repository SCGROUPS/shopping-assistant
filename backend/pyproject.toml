[project]
name = "tourism-shopping-assistant-backend"
version = "0.1.0"
description = "Intelligent Tourism E-Ticket Shopping Assistant POC backend"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "azure-identity>=1.19,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "pgvector>=0.3,<1",
  "pillow>=11,<13",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "qrcode>=8,<9",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["app"]
